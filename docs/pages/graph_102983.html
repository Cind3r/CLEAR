<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Network Graph Viewer</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/dist/vis-network.min.css"
    integrity="sha512-WgxfT5LWjfszlPHXRmBWHkV2eceiWTOBvrKCNbdgDYTHrT2AeLCGbF4sZlZw3UMN3WtL0tGUoIAKsu8mllg/XA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"
    integrity="sha512-LnvoEWDFrqGHlHmDD2101OrLcbsfkrzoSpvtSQtxK3RMnRV0eOkhhBN2dXHKRrUU8p2DGRTk35n4O8nWSVe1mQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Segoe UI, Arial, sans-serif;
      background: #f8fafc;
      color: #111827;
    }

    .page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .actions a {
      display: inline-block;
      text-decoration: none;
      color: #ffffff;
      background: #2563eb;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    .actions a:hover {
      background: #1d4ed8;
    }

    #status {
      font-size: 13px;
      color: #334155;
    }

    #mynetwork {
      width: 100%;
      height: calc(100vh - 120px);
      min-height: 640px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1 id="graph-title">Network Graph</h1>
      <div class="actions">
        <a href="../index.html">Back to Price Finder</a>
        <a href="healthcare-costs-story.html">Open Story</a>
      </div>
    </div>
    <div id="status" aria-live="polite"></div>
    <div id="mynetwork" role="img" aria-label="Network graph visualization"></div>
  </div>

  <script src="../js/network-graph-loader.js"></script>
</body>
</html>
